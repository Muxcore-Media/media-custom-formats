syntax = "proto3";
package muxcore.formats.v1;
option go_package = "github.com/Muxcore-Media/media-custom-formats/proto/formatsv1;formatsv1";

service FormatService {
  rpc ListFormats(ListFormatsRequest) returns (ListFormatsResponse);
  rpc CreateFormat(CreateFormatRequest) returns (CreateFormatResponse);
  rpc UpdateFormat(UpdateFormatRequest) returns (UpdateFormatResponse);
  rpc DeleteFormat(DeleteFormatRequest) returns (DeleteFormatResponse);

  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse);
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc DeleteProfile(DeleteProfileRequest) returns (DeleteProfileResponse);

  rpc ScoreRelease(ScoreReleaseRequest) returns (ScoreReleaseResponse);
  rpc ParseQuality(ParseQualityRequest) returns (ParseQualityResponse);

  rpc ListReleaseProfiles(ListReleaseProfilesRequest) returns (ListReleaseProfilesResponse);
  rpc UpsertReleaseProfile(UpsertReleaseProfileRequest) returns (UpsertReleaseProfileResponse);
  rpc DeleteReleaseProfile(DeleteReleaseProfileRequest) returns (DeleteReleaseProfileResponse);

  // SyncTrashGuides imports custom formats (and optionally quality profiles) from a
  // TRaSH Guides tree (local path or downloaded archive). Formats are upserted by trash_id.
  rpc SyncTrashGuides(SyncTrashGuidesRequest) returns (SyncTrashGuidesResponse);
}

// ── Custom Formats ────────────────────────────────────────────

message CustomFormat {
  string id = 1;
  string name = 2;
  repeated FormatRule rules = 3;
  int32 default_score = 4;
  string created_at = 5;
  string updated_at = 6;
  string trash_id = 7;      // TRaSH Guides trash_id when imported
  string trash_service = 8; // "radarr" | "sonarr" when imported
}

message FormatRule {
  string field = 1;    // "title", "size", "seeders", "resolution", "source", "quality_modifier", "release_group", "language"
  string op = 2;       // "matches", "contains", "gt", "lt", "gte", "lte", "eq"
  string value = 3;    // regex or comparison value
  bool negate = 4;
  bool required = 5;   // Arr/TRaSH semantics: all required must match; at least one optional if any exist
}

message ListFormatsRequest {}

message ListFormatsResponse {
  repeated CustomFormat formats = 1;
}

message CreateFormatRequest {
  string name = 1;
  repeated FormatRule rules = 2;
  int32 default_score = 3;
}

message CreateFormatResponse {
  CustomFormat format = 1;
}

message UpdateFormatRequest {
  string id = 1;
  string name = 2;
  repeated FormatRule rules = 3;
  int32 default_score = 4;
}

message UpdateFormatResponse {
  CustomFormat format = 1;
}

message DeleteFormatRequest {
  string id = 1;
}

message DeleteFormatResponse {}

// ── Quality Profiles ───────────────────────────────────────────

message QualityProfile {
  string id = 1;
  string name = 2;
  int32 min_score = 3;
  int32 cutoff_score = 4;
  bool upgrade_allowed = 5;
  int32 upgrade_delay_minutes = 6;
  map<string, int32> format_scores = 7;  // format_id → score
  string created_at = 8;
  string updated_at = 9;
}

message ListProfilesRequest {}

message ListProfilesResponse {
  repeated QualityProfile profiles = 1;
}

message CreateProfileRequest {
  string name = 1;
  int32 min_score = 2;
  int32 cutoff_score = 3;
  bool upgrade_allowed = 4;
  int32 upgrade_delay_minutes = 5;
  map<string, int32> format_scores = 6;
}

message CreateProfileResponse {
  QualityProfile profile = 1;
}

message UpdateProfileRequest {
  string id = 1;
  string name = 2;
  int32 min_score = 3;
  int32 cutoff_score = 4;
  bool upgrade_allowed = 5;
  int32 upgrade_delay_minutes = 6;
  map<string, int32> format_scores = 7;
}

message UpdateProfileResponse {
  QualityProfile profile = 1;
}

message DeleteProfileRequest {
  string id = 1;
}

message DeleteProfileResponse {}

// ── Scoring ────────────────────────────────────────────────────

message ScoreReleaseRequest {
  string title = 1;
  int64 size = 2;
  int32 seeders = 3;
  string category = 4;
  string sub_category = 5;
  string download_protocol = 6;
  string profile_id = 7;  // optional, uses first profile if empty
}

message ScoreReleaseResponse {
  int32 total_score = 1;
  int32 quality_score = 2;
  int32 format_score = 3;
  repeated FormatMatch format_matches = 4;
  QualityInfo quality = 5;
}

message FormatMatch {
  string format_id = 1;
  string format_name = 2;
  int32 score = 3;
  string rule_matched = 4;
}

message QualityInfo {
  string resolution = 1;  // "2160p", "1080p", etc.
  string source = 2;       // "Remux", "BluRay", "WEB-DL", "HDTV"
  string codec = 3;        // "h264", "hevc", "av1"
  bool hdr = 4;
  string label = 5;
  int32 score = 6;
}

message ParseQualityRequest {
  string title = 1;
}

message ParseQualityResponse {
  QualityInfo quality = 1;
}

message ReleaseProfile {
  string id = 1;
  string name = 2;
  repeated string preferred = 3;
  repeated string must_contain = 4;
  repeated string must_not_contain = 5;
  int32 preferred_score = 6;
  bool enabled = 7;
}

message ListReleaseProfilesRequest {}

message ListReleaseProfilesResponse {
  repeated ReleaseProfile profiles = 1;
}

message UpsertReleaseProfileRequest {
  string id = 1; // empty = create
  string name = 2;
  repeated string preferred = 3;
  repeated string must_contain = 4;
  repeated string must_not_contain = 5;
  int32 preferred_score = 6;
  bool enabled = 7;
}

message UpsertReleaseProfileResponse {
  ReleaseProfile profile = 1;
}

message DeleteReleaseProfileRequest {
  string id = 1;
}

message DeleteReleaseProfileResponse {}

// ── TRaSH Guides sync ──────────────────────────────────────────

message SyncTrashGuidesRequest {
  // Local path to a TRaSH Guides repo root (must contain metadata.json). Empty uses
  // FORMATS_TRASH_GUIDES_PATH or downloads FORMATS_TRASH_GUIDES_URL into the cache dir.
  string path = 1;
  // trash_scores key to apply (default, german, anime-radarr, …). Empty → "default".
  string score_set = 2;
  // When true, also upsert quality profiles from the guides tree.
  bool import_profiles = 3;
  // Services to import: "radarr", "sonarr". Empty → both.
  repeated string services = 4;
}

message SyncTrashGuidesResponse {
  int32 formats_upserted = 1;
  int32 formats_skipped = 2;
  int32 profiles_upserted = 3;
  string guides_path = 4;
  repeated string warnings = 5;
}

